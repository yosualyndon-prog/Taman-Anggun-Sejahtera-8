<style>
:root{--g:#1f3d2f;--g2:#2c5441;--gold:#b8975a;--bg:#fff;--bg2:#f5f1e8;--bg3:#eef0ee;--tx:#222a26;--mu:#66706a;--bd:#e2e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121815;--bg2:#1a221d;--bg3:#202a24;--tx:#e8ebe8;--mu:#9aa59e;--bd:#2d3a32;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121815;--bg2:#1a221d;--bg3:#202a24;--tx:#e8ebe8;--mu:#9aa59e;--bd:#2d3a32}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 Poppins,Inter,system-ui,sans-serif}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;font-weight:600}h2{font-size:clamp(1.6rem,3.5vw,2.2rem)}
a{color:inherit}img{max-width:100%;display:block}
.w{max-width:1120px;margin:0 auto;padding:0 20px}.sec{padding:72px 0}.alt{background:var(--bg2)}
.eyebrow{color:var(--gold);letter-spacing:.14em;font-size:.75rem;text-transform:uppercase;font-weight:500}
.mu{color:var(--mu)}
.btn{display:inline-block;border:1px solid var(--g);background:var(--g);color:#fff;padding:12px 24px;border-radius:999px;font:500 .92rem Poppins,sans-serif;cursor:pointer;text-decoration:none;transition:.25s}
.btn:hover{background:var(--g2);transform:translateY(-2px)}.btn.o{background:transparent;color:inherit;border-color:currentColor}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1b1b}.btn.s{padding:8px 16px;font-size:.82rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:600;color:var(--g);text-decoration:none;line-height:1.1}.logo small{display:block;font-size:.6rem;letter-spacing:.16em;color:var(--gold)}
@media(prefers-color-scheme:dark){.logo{color:#cfe3d6}}
.menu{display:flex;gap:22px;align-items:center}.menu a{text-decoration:none;font-size:.88rem;color:var(--mu);transition:.2s}.menu a:hover,.menu a.on{color:var(--gold)}
#bg{display:none;background:none;border:0;font-size:1.6rem;color:inherit;cursor:pointer}
@media(max-width:900px){#bg{display:block}.menu{display:none;position:absolute;left:0;right:0;top:68px;background:var(--bg);flex-direction:column;padding:16px 20px 24px;gap:14px;border-bottom:1px solid var(--bd)}.menu.open{display:flex}}
.hero{min-height:84vh;display:flex;align-items:center;color:#fff;background:linear-gradient(105deg,rgba(18,40,30,.92),rgba(18,40,30,.55)),radial-gradient(circle at 80% 20%,#4d7a5f,#1f3d2f 60%)}
.hero h1{font-size:clamp(2rem,5.5vw,3.6rem);max-width:720px}.hero p{max-width:560px;opacity:.9}.hero .btn.o{color:#fff}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;overflow:hidden;transition:.3s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.1)}
.card .b{padding:20px}.ico{width:44px;height:44px;border-radius:50%;background:var(--bg2);color:var(--gold);display:grid;place-items:center;font-size:1.2rem;margin-bottom:12px}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--bg3),var(--bg2));display:grid;place-items:center;color:var(--mu);font-size:.8rem;text-align:center;padding:10px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.hp{aspect-ratio:auto;display:block;padding:0;background:var(--bg2);cursor:zoom-in}.hp img{height:auto;object-fit:contain}.card:hover .hp img{transform:none}.card:hover .ph img,.gi:hover img{transform:scale(1.06)}
.spec{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--mu);margin:8px 0}.tag{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--gold)}
.gi{aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--bg3);position:relative}.gi img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.chips button{border:1px solid var(--bd);background:var(--bg);color:inherit;padding:6px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem}.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.cta{background:var(--g);color:#fff;text-align:center}
footer{background:#14241c;color:#b9c4bd;padding:36px 0;font-size:.85rem}
.fr{opacity:0;transform:translateY(18px);transition:.7s}.fr.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.fr{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;background:#25a244;color:#fff;border-radius:99px;padding:13px 20px;font-weight:500;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:.9rem}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:inherit;font:inherit;margin:4px 0 12px}label{font-size:.82rem;color:var(--mu)}
.two{display:grid;gap:30px;grid-template-columns:1fr 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:40;display:none;align-items:center;justify-content:center}#lb.on{display:flex}#lb img,#lb video{max-width:90vw;max-height:84vh;border-radius:8px}#lb button{position:absolute;background:none;border:0;color:#fff;font-size:2.2rem;cursor:pointer;padding:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 22px;border-radius:12px;z-index:50;display:none;max-width:90vw}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.ov{overflow-x:auto}
.ad{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}
</style></head><body>
<header><div class="w"><nav><a class="logo" href="#home">TAMAN ANGGUN SEJAHTERA 8<small>BERSATU SUKSES GROUP</small></a>
<button id="bg" aria-label="Menu">☰</button><div class="menu" id="menu"></div></nav></div></header>

<div id="lb"><button id="lx" style="top:0;right:0">×</button><button id="lp" style="left:0">‹</button><div id="lc"></div><button id="ln" style="right:0">›</button></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const NAV=[["home","Home"],["tentang","Tentang Kami"],["keunggulan","Keunggulan"],["tipe","Tipe Rumah"],["fasilitas","Fasilitas"],["galeri","Galeri"],["lokasi","Lokasi"],["kpr","Simulasi KPR"],["kontak","Kontak"]];
const S={site:{},houses:[],features:[],facilities:[],gallery:[],leads:[]};let DB=null,ADMIN=false,UP=null,gcat="Semua",lbi=0,lbl=[];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=(m)=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3800)};
const site=(k,d)=>S.site[k]||d;
const PH="[Isi melalui dashboard admin]";
function wa(msg){const n=(S.site.wa||"").replace(/\D/g,"");if(!n){T("Nomor WhatsApp marketing belum diatur oleh admin.");return}
 window.open("https://wa.me/"+n+"?text="+encodeURIComponent(msg||"Halo, saya tertarik dengan perumahan Taman Anggun Sejahtera 8. Saya ingin mendapatkan informasi lebih lanjut mengenai tipe rumah, harga, dan ketersediaan unit."),"_blank","noopener")}
const img=(u,a)=>u?`<img src="${esc(u)}" alt="${esc(a)}" loading="lazy">`:`<span>Foto belum tersedia</span>`;
const ICONS=["🏡","🌿","🛡️","📍","🏊","📈"];
const DEFF=[["Desain Bangunan"],["Kenyamanan Lingkungan"],["Keamanan Kawasan"],["Aksesibilitas"],["Fasilitas Lingkungan"],["Potensi Investasi"]].map(x=>({title:x[0],text:PH,ph:1}));
const H={
hero:()=>`<section class="hero"><div class="w"><p class="eyebrow">BERSATU SUKSES GROUP</p><h1>${esc(site("headline","Temukan Hunian Nyaman untuk Masa Depan Anda"))}</h1><p>Taman Anggun Sejahtera 8, pilihan hunian yang dirancang untuk memberikan kenyamanan bagi Anda dan keluarga.</p><p style="margin-top:28px"><a class="btn gold" href="#tipe">Jelajahi Perumahan</a> <button class="btn o" onclick="wa()">Konsultasi Sekarang</button></p></div></section>`,
intro:()=>`<section class="sec fr"><div class="w two"><div><p class="eyebrow">Tentang Proyek</p><h2>Taman Anggun Sejahtera 8</h2></div><p class="mu">${esc(site("intro","Taman Anggun Sejahtera 8 adalah proyek perumahan dari Bersatu Sukses Group. "+PH))}</p></div></section>`,
cards:(a,t)=>`<div class="grid">${a.map((f,i)=>`<div class="card fr"><div class="b"><div class="ico">${esc(f.icon||ICONS[i%6])}</div><h3>${esc(f.title)}</h3><p class="mu">${esc(f.text)}</p></div></div>`).join("")}</div>`,
feat:()=>`<section class="sec alt fr"><div class="w"><p class="eyebrow">Keunggulan</p><h2>Mengapa Taman Anggun Sejahtera 8</h2>${H.cards(S.features.length?S.features:DEFF)}</div></section>`,
fac:()=>`<section class="sec fr"><div class="w"><p class="eyebrow">Fasilitas</p><h2>Fasilitas Taman Anggun Sejahtera 8</h2><p class="mu">Perumahan ini dilengkapi dengan berbagai fasilitas unggulan yang dirancang untuk meningkatkan kualitas hidup penghuninya:</p>${S.facilities.length?`<div class="grid">${S.facilities.map(f=>`<div class="card fr"><div class="ph">${img(f.photo,f.title)}</div><div class="b"><h3>${esc(f.title)}</h3><p class="mu">${esc(f.text)}</p></div></div>`).join("")}</div>`:`<p class="mu">Data fasilitas belum diisi. Admin dapat menambahkannya melalui dashboard.</p>`}</div></section>`,
houses:(n)=>{const a=n?S.houses.slice(0,n):S.houses;return `<section class="sec alt fr"><div class="w"><p class="eyebrow">Tipe Rumah</p><h2>Pilihan Tipe Hunian</h2>${a.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))">${a.map(h=>`<div class="card fr"><div class="ph hp" onclick="one('${esc(h.photo)}','Denah tipe ${esc(h.name)}')">${img(h.photo,"Rumah tipe "+h.name)}</div><div class="b"><span class="tag">${esc(h.status||"Tersedia")}</span><h3>Tipe ${esc(h.name)}</h3><div class="spec"><span>LT ${esc(h.lt||"-")} m²</span><span>LB ${esc(h.lb||"-")} m²</span><span>${esc(h.kt||"-")} KT</span><span>${esc(h.km||"-")} KM</span><span>${esc(h.lantai||"1")} lantai</span></div><p class="mu" style="font-size:.85rem">${esc(h.spec||"")}</p><p><b>${esc(h.price||"Harga: hubungi marketing")}</b></p><button class="btn s" onclick="wa('Halo, saya ingin bertanya tentang rumah Tipe ${esc(h.name).replace(/'/g,"")} di Taman Anggun Sejahtera 8.')">Tanyakan Tipe Ini via WhatsApp</button></div></div>`).join("")}</div>`:`<p class="mu">Tipe rumah belum ditambahkan. Admin dapat menambahkannya melalui dashboard.</p>`}${n?`<p style="margin-top:24px"><a class="btn o s" href="#tipe">Lihat Detail</a></p>`:""}</div></section>`},
gal:(n)=>{const cats=["Semua",...new Set(S.gallery.map(g=>g.cat))];let a=S.gallery.filter(g=>gcat=="Semua"||g.cat==gcat);if(n)a=a.slice(0,n);lbl=a;
 return `<section class="sec fr"><div class="w"><p class="eyebrow">Galeri</p><h2>Galeri Perumahan</h2>${!n&&S.gallery.length?`<div class="chips">${cats.map(c=>`<button class="${c==gcat?"on":""}" onclick="gcat='${esc(c)}';render()">${esc(c)}</button>`).join("")}</div>`:""}${a.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${a.map((g,i)=>`<div class="gi" onclick="lb(${i})">${g.type=="video"?`<div class="ph" style="height:100%;aspect-ratio:auto">▶ ${esc(g.title||"Video")}</div>`:img(g.url,g.title||g.cat)}</div>`).join("")}</div>`:`<p class="mu">Belum ada foto atau video. Admin dapat mengunggahnya melalui dashboard.</p>`}${n?`<p style="margin-top:24px"><a class="btn o s" href="#galeri">Lihat Galeri Lengkap</a></p>`:""}</div></section>`},
loc:()=>`<section class="sec alt fr"><div class="w two"><div><p class="eyebrow">Lokasi</p><h2>Lokasi Perumahan</h2><p class="mu">${esc(site("address","Alamat lengkap: "+PH))}</p>${site("maps")?`<a class="btn" target="_blank" rel="noopener" href="${esc(S.site.maps)}">Lihat Rute Lokasi</a>`:`<p class="mu"><i>Link Google Maps belum diatur.</i></p>`}</div>${mapEmbed()}</div></section>`,
cta:()=>`<section class="sec cta fr"><div class="w"><h2>Wujudkan Hunian Impian Anda Bersama Kami</h2><p><button class="btn gold" onclick="wa()">Hubungi Marketing via WhatsApp</button></p></div></section>`,
about:()=>`<section class="sec fr"><div class="w"><p class="eyebrow">Tentang Kami</p><h2>Bersatu Sukses Group</h2><p class="mu">${esc(site("about","Profil perusahaan: "+PH))}</p><div class="grid"><div class="card"><div class="b"><h3>Visi</h3><p class="mu">${esc(site("vision","Ikut serta dalam pemenuhan kebutuhan perumahan secara regional maupun nasional."))}</p></div></div><div class="card"><div class="b"><h3>Misi</h3><p class="mu">${esc(site("mission","Mewujudkan kawasan-kawasan efektif untuk pengembangan pembangunan serta menghadirkan hunian yang nyaman, berkualitas, dan terjangkau bagi keluarga modern."))}</p></div></div></div></div></section>`,
contact:()=>`<section class="sec fr"><div class="w two"><div><p class="eyebrow">Kontak</p><h2>Hubungi Kami</h2><p><b>Bersatu Sukses Group</b><br>Proyek: Taman Anggun Sejahtera 8</p><p class="mu">WhatsApp: ${esc(site("wa","[belum diatur]"))}<br>Alamat: ${esc(site("address","[belum diatur]"))}<br>Email: ${esc(site("email","[belum diatur]"))}<br>Jam operasional: ${esc(site("hours","[belum diatur]"))}</p><button class="btn" onclick="wa()">Chat WhatsApp</button></div>
<form id="lf" novalidate><label>Nama lengkap *</label><input name="name" required maxlength="80"><label>Nomor WhatsApp *</label><input name="phone" required inputmode="tel" maxlength="20"><label>Email (opsional)</label><input name="email" type="email" maxlength="100"><label>Tipe rumah yang diminati</label><select name="type"><option value="">Belum menentukan</option>${S.houses.map(h=>`<option>${esc(h.name)}</option>`).join("")}</select><label>Pesan atau pertanyaan</label><textarea name="msg" rows="4" maxlength="800"></textarea><button class="btn" type="submit">Kirim Konsultasi</button></form></div></section>`
};
function mapEmbed(){const m=S.site.maps||"",a=S.site.address||"";let u="";if(/google\.[^/]+\/maps\/embed/.test(m))u=m;else if(a)u="https://www.google.com/maps?q="+encodeURIComponent(a+" Taman Anggun Sejahtera 8")+"&output=embed";
 return u?`<a href="${esc(m||"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a))}" target="_blank" rel="noopener" style="text-decoration:none"><div class="ph" style="aspect-ratio:16/10;border-radius:16px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;flex-direction:column;gap:8px;font-size:1rem"><span style="font-size:2.4rem">📍</span><b>Buka lokasi di Google Maps</b><span style="opacity:.8;font-size:.85rem">${esc(a)}</span></div></a>`:`<div class="ph" style="aspect-ratio:16/10;border-radius:16px">Peta akan tampil setelah admin mengisi alamat atau link Google Maps</div>`}
function kprView(){return `<section class="sec fr"><div class="w"><p class="eyebrow">Simulasi KPR</p><h2>Kalkulator Cicilan KPR</h2><p class="mu">Perkirakan cicilan bulanan Anda dengan mengisi harga rumah, uang muka, suku bunga, dan lama cicilan.</p><div class="two" id="kp" style="margin-top:24px"><form onsubmit="return false"><label>Harga rumah (Rp)</label><input name="p" type="number" min="0" step="1000000" inputmode="numeric" placeholder="contoh: 500000000"><label>Uang muka / DP (%)</label><input name="d" type="number" min="0" max="90" step="1" value="20"><label>Suku bunga per tahun (%)</label><input name="i" type="number" min="0" max="30" step="0.1" value="8"><label>Lama cicilan (tahun)</label><input name="y" type="number" min="1" max="30" step="1" value="15"><p class="mu" style="font-size:.8rem">Nilai DP, bunga, dan tenor di atas hanya contoh awal. Silakan ubah sesuai penawaran bank Anda.</p></form><div class="card"><div class="b" id="kr"></div></div></div><div class="card" style="margin-top:24px;border-color:var(--gold)"><div class="b"><b>Penting:</b> <span class="mu">Hasil ini hanyalah simulasi dengan asumsi suku bunga tetap selama seluruh masa cicilan (metode anuitas). Perhitungan belum termasuk biaya provisi, administrasi, appraisal, asuransi, notaris, BPHTB, dan biaya lain. Suku bunga, uang muka, dan persetujuan kredit yang sebenarnya ditentukan oleh bank dan dapat berbeda dari simulasi ini.</span></div></div></div></section>`}
function kcalc(){const q=n=>parseFloat(document.querySelector('#kp [name='+n+']').value),r=$("#kr"),fm=v=>"Rp "+Math.round(v).toLocaleString("id-ID");
 const run=()=>{const P=q('p'),d=q('d'),i=q('i'),y=q('y');if(!(P>0)||!(d>=0&&d<=90)||!(i>=0&&i<=30)||!(y>=1&&y<=30)){r.innerHTML='<p class="mu">Isi harga rumah, uang muka (0–90%), suku bunga (0–30%), dan lama cicilan (1–30 tahun) dengan benar untuk melihat hasil simulasi.</p>';return}
 const dp=P*d/100,L=P-dp,n=Math.round(y*12),m=i/1200,c=m?L*m/(1-Math.pow(1+m,-n)):L/n,tot=c*n;
 window.KMSG='Halo, saya sudah mencoba simulasi KPR Taman Anggun Sejahtera 8: harga '+fm(P)+', DP '+d+'%, bunga '+i+'%, tenor '+y+' tahun, estimasi cicilan '+fm(c)+' per bulan. Saya ingin konsultasi lebih lanjut.';
 r.innerHTML=`<p class="mu" style="margin:0">Estimasi cicilan per bulan</p><h2 style="color:var(--gold);margin:4px 0 16px">${fm(c)}</h2><div class="row"><span class="mu">Uang muka (${d}%)</span><b>${fm(dp)}</b></div><div class="row"><span class="mu">Pokok pinjaman</span><b>${fm(L)}</b></div><div class="row"><span class="mu">Total bunga</span><b>${fm(tot-L)}</b></div><div class="row"><span class="mu">Total pembayaran cicilan</span><b>${fm(tot)}</b></div><p class="mu" style="font-size:.78rem">*Simulasi, bukan penawaran resmi. Syarat dan ketentuan aktual mengikuti bank.</p><button class="btn s" onclick="wa(KMSG)">Konsultasikan via WhatsApp</button>`};
 document.querySelectorAll('#kp input').forEach(e=>e.oninput=run);run()}
const PAGES={kpr:()=>kprView()+H.cta(),home:()=>H.hero()+H.intro()+H.feat()+H.houses(3)+H.gal(6)+H.loc()+H.cta(),tentang:()=>H.about()+H.cta(),keunggulan:()=>H.feat()+H.cta(),tipe:()=>H.houses()+H.cta(),fasilitas:()=>H.fac()+H.cta(),galeri:()=>H.gal(),lokasi:()=>H.loc()+H.cta(),kontak:()=>H.contact(),admin:()=>adminView()};
function render(){const p=(location.hash.slice(1)||"home");const pg=PAGES[p]?p:"home";
 $("#menu").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==pg?"on":""}">${n[1]}</a>`).join("")+`<a class="btn s" style="color:#fff" href="#kontak" onclick="event.preventDefault();wa()">Hubungi Marketing</a>`;
 $("#app").innerHTML=PAGES[pg]();document.title=pg=="home"?"Taman Anggun Sejahtera 8 | Hunian Nyaman Bersama Bersatu Sukses Group":NAV.find(n=>n[0]==pg)?.[1]+" | Taman Anggun Sejahtera 8";
 $("#foot").innerHTML=`<b>BERSATU SUKSES GROUP</b> · Taman Anggun Sejahtera 8<br>${esc(site("address",""))} ${esc(site("email",""))}<br><a href="#admin" style="opacity:.6">Admin</a>`;
 $("#menu").classList.remove("open");obs();const f=$("#lf");if(f)f.onsubmit=lead;if($("#kp"))kcalc()}
function obs(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll(".fr").forEach(e=>io.observe(e))}
